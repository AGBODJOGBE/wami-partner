name: wami_pro
description: WAMI Pro — application des chauffeurs et des livreurs partenaires.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Socle partagé (design system, réseau, erreurs). Voir README à la racine.
  wami_core:
    path: ../../packages/wami_core
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.2
  go_router: ^14.6.2
  # Plugins propres à WAMI Pro (règle 4 : jamais dans le socle).
  flutter_secure_storage: ^9.2.2   # jeton de session
  geolocator: ^13.0.2              # position (statut en ligne, suivi de course)
  image_picker: ^1.1.2             # pièces, photos de colis
  socket_io_client: ^3.0.2         # offres et suivi en temps réel (pur Dart)
  url_launcher: ^6.3.1             # appel et SMS vers le client
  firebase_core: ^3.8.1            # push : nécessite google-services.json / GoogleService-Info.plist
  firebase_messaging: ^15.1.6      # push : offres et rappels app fermée
  package_info_plus: ^8.1.2        # version installée (mise à jour forcée)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
